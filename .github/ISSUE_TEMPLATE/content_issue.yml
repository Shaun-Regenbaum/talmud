name: Wrong or misplaced note
description: A generated note is attached to the wrong text, names the wrong person, mistranslates, or states something false.
labels: ["content"]
body:
  - type: markdown
    attributes:
      value: |
        Most of what the reader shows is generated by a producer (an AI step with a fixed recipe) and pinned to the page by a placer. Both make mistakes. Reports with a source we can check are the fastest way to fix them, and human corrections outrank generated output in this project.
  - type: input
    id: page
    attributes:
      label: Tractate and page
      placeholder: Berakhot 2a
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Language of the note
      options:
        - English
        - Hebrew
    validations:
      required: true
  - type: dropdown
    id: note
    attributes:
      label: Which note?
      description: The card or marker that is wrong.
      options:
        - Background (prerequisites for the daf)
        - Argument map or overview
        - Practical halacha
        - Rishonim or commentary
        - A person (rabbi identity, generation, place)
        - A place (geography)
        - A verse (pasuk) citation
        - A parallel (Yerushalmi, Mesorat HaShas, other dapim)
        - Word-level translation
        - Questions and answers
        - Something else
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What kind of mistake?
      options:
        - Attached to the wrong words (placement)
        - Names the wrong person
        - Wrong fact or wrong reasoning
        - Wrong translation
        - Missing a source or citing a wrong one
        - Should not be there at all
    validations:
      required: true
  - type: textarea
    id: wrong
    attributes:
      label: What does the note say, and what is wrong with it?
      description: Quote the note. If placement is wrong, say which words it sits on and which it should sit on.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: What is correct, and how do you know?
      description: A source we can check (a line in the Gemara, Rashi, a Sefaria link, a printed reference). "I learned it this way" is a fine start, but a source lets us fix it with confidence.
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshot
