name = "tanach"
main = "src/worker/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
# Custom production domains. The shaunregenbaum.com and tanach.dev zones are
# both on the same account as this worker; wrangler provisions the DNS record +
# cert on deploy. Same shape as talmud: one deployment, all hostnames identical.
# (Top-level key — must precede any [table] header or TOML folds it into it.)
routes = [
  { pattern = "tanach.shaunregenbaum.com", custom_domain = true },
  { pattern = "tanach.dev", custom_domain = true },
  { pattern = "www.tanach.dev", custom_domain = true }
]

# Dynamic Worker Loader — powers the code-mode MCP server at /mcp (the shared
# @corpus/core/mcp/code-mode, same as talmud). The `execute` tool runs
# LLM-written code in an isolated worker spun up via env.LOADER; the sandbox has
# no bindings of its own and reaches the API only through the in-process
# request bridge. Optional: without it, /mcp answers 503.
worker_loaders = [{ binding = "LOADER" }]

# Workers Analytics Engine: one row per /api request that reached the Worker
# (surface = app | mcp | api) and one per MCP request. Read back on talmud.dev's
# Usage -> MCP tab through the account-level SQL API. Optional binding.
[[analytics_engine_datasets]]
binding = "SURFACE"
dataset = "tanach_surface"

# The Solid client is built into ./dist/client and served by the Worker via the
# ASSETS binding; unmatched routes fall through to index.html (SPA).
[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"
# run_worker_first as a PATTERN LIST is exclusive: ONLY matching paths invoke
# the Worker — everything else is served from assets, with non-asset paths
# falling back to index.html (SPA), the Worker never running. So the list must
# name the Worker's entire live surface, not just the paths that need
# worker-FIRST ordering: when it was just ["/"], every /api/* request returned
# the SPA shell and the app's data layer went down (2026-07-17). "/" is here so
# the legacy-host redirect fires on the bare domain (the catch-all `app.get('*')`
# hands it back to assets on the canonical host); hashed /assets/* stay on the
# CDN fast path by not matching.
run_worker_first = ["/", "/api/*", "/mcp"]

[observability]
enabled = true

# Result cache for the producers (event labels, later synthesis/context). The
# reader's Sefaria fetches stay un-cached for now; this is the AI-output store.
[[kv_namespaces]]
binding = "CACHE"
id = "2d3ee093681441c58cf7e9f08420acc7"

[vars]
BILLING_APP = "tanach"
# OpenRouter calls route through a Cloudflare AI Gateway (the only path in
# @corpus/core). We reuse the existing `talmud` gateway for now — creating a
# dedicated `tanach` gateway needs a token with AI-Gateway scope (the MCP token
# is KV-only). Swap to AI_GATEWAY_ID = "tanach" once it exists. Usage is tracked
# in our own KV ledger (/api/usage), independent of the gateway.
AI_GATEWAY_ID = "talmud"
# Needed to build the AI Gateway URL. Not secret (it's the account id).
CLOUDFLARE_ACCOUNT_ID = "ddf8edfc3dfd489567fe3c5b28b51aca"
# Cheap + fast default for the producers (short structured output).
DEFAULT_LLM_MODEL = "openrouter/deepseek/deepseek-v4-flash"
OPENROUTER_GATEWAY_PROVIDER = "openrouter"
# Spend caps enforced at the runLLM chokepoint (@corpus/core/llm/budget).
DAILY_BUDGET_USD = "20"
HOURLY_CUSTOM_BUDGET_USD = "5"

# Secret: OPENROUTER_API_KEY (`wrangler secret put OPENROUTER_API_KEY` from
# this directory). The deployed value lives in vault at
# legacy/prod/tanach/openrouter-api-key; local dev reads a SEPARATE, spend-
# capped dev key from packages/tanach/.dev.vars (gitignored, one copy per
# worktree) recorded at legacy/prod/tanach/openrouter-api-key-dev.
#
# SHARED CREDIT POOL: the tanach and talmud keys sit in one OpenRouter
# workspace, so they draw on the SAME prepaid balance — a tanach backfill can
# starve talmud generation and vice versa. The per-key weekly caps (tanach
# prod $20, tanach dev $15) bound each side; the budget caps above bound this
# worker's own spend. Both apps classify a dry pool REACTIVELY via
# classifyAiUnavailable (@corpus/core/llm/ai-status) and surface the shared
# "AI paused" banner; only talmud additionally checks the live account balance
# BEFORE starting generation (packages/talmud/src/worker/ai-credits.ts, which
# needs OPENROUTER_PROVISIONING_KEY). That probe reads whichever workspace the
# provisioning key belongs to, so it must be a key from the SAME workspace as
# the inference keys above or it reports the wrong pool.

# Warm-cron: keep this week's parsha's chapter enrichments hot (warm-cron.ts).
# Every 30 min — a fresh parsha warms over a few ticks, then the cursor latches
# and ticks are no-ops until the parsha changes.
[triggers]
crons = ["*/30 * * * *"]

[[d1_databases]]
binding = "BILLING_DB"
database_name = "corpus-billing"
database_id = "50ab90fa-cfdd-4b8c-8576-68f3eba6371d"
migrations_dir = "../talmud/migrations"

# Read existing pasuk cards without starting Talmud generation.
[[services]]
binding = "TALMUD"
service = "talmud"

# Review new releases here before approving production.
[env.staging]
name = "tanach-staging"
workers_dev = false
preview_urls = false
routes = [{ pattern = "staging.tanach.dev", custom_domain = true }]
worker_loaders = [{ binding = "LOADER" }]
workflows = []
analytics_engine_datasets = []
send_email = []

[env.staging.vars]
APP_ENV = "staging"
BILLING_APP = "tanach"
GENERATION_DISABLED = "1"
WORKER_ROLE = "reader"
PUBLIC_ORIGIN = "https://staging.tanach.dev"
LEARNED_ADJACENCY = "1"

[env.staging.triggers]
crons = []

[env.staging.queues]
producers = []
consumers = []

[[env.staging.kv_namespaces]]
binding = "CACHE"
id = "e4fab94968a64e3c8626a101edce9280"

[[env.staging.d1_databases]]
binding = "BILLING_DB"
database_name = "corpus-billing-staging"
database_id = "49930fc7-f92a-446b-886d-0ec8ae882dc6"
migrations_dir = "../talmud/migrations"

[[env.staging.services]]
binding = "STAGING_SOURCE"
service = "corpus-staging-source"

[[env.staging.services]]
binding = "TALMUD"
service = "talmud-staging"
