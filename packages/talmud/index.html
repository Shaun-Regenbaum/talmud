<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Talmud</title>
    <meta
      name="description"
      content="A free, open-source Talmud study reader. The Vilna page as printed, with background, argument maps, halacha, people, places, and verses pinned to the words they are about. English and Hebrew."
    />
    <meta property="og:title" content="Talmud.dev" />
    <meta
      property="og:description"
      content="The daf, covered in smart notes. A free, open-source Talmud study reader in English and Hebrew."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://talmud.dev/" />

    <!-- Installable / standalone (iOS Add to Home Screen + Android PWA) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f8f5ee" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Talmud" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Spectral is the English reading serif shared with the Tanach reader
         (the --font-serif token in @corpus/ui): note prose, the About page,
         the guides. Chrome stays in the system sans. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap"
    />
    <link rel="stylesheet" href="/src/client/styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
